name: E2E Test Verification
run-name: >-
    ${{
        github.event_name == 'pull_request'
        && format('E2E Test Verification for CI: PR #{0} -> {1}', github.event.number, github.event.pull_request.title)
        ||
        github.event_name == 'push'
        && format('E2E Test Verification for CI: Merge -> {0}', github.event.head_commit.message)
    }}

on:
    pull_request:
        types: [opened, synchronize, reopened]
    push:
        branches: ["main"]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    e2e-ci-test:
        name: RabbitMQ E2E
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
        - name: 📥 Git -- Checkout repository
          uses: actions/checkout@v7

        - name: 📘 Go -- Set up
          uses: actions/setup-go@v7
          with:
            go-version-file: 'go.mod'
            cache: true

        - name: 🧪 Go -- E2E Tests
          run: |
            echo "⚙️ Running end-to-end tests against a RabbitMQ container..."
            if go test -v -tags=e2e ./app/e2e; then
                echo ""
                echo "✅ E2E tests passed successfully."
            else
                echo ""
                echo "❌ E2E tests failed. Please fix the errors above."
                exit 1
            fi
